name: Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (gofmt + vet + test/cov95)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install cgo build dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc libc6-dev libcurl4-openssl-dev

      - name: Create frontend stub for embed
        run: mkdir -p web/out && touch web/out/.gitkeep

      - name: gofmt
        run: |
          unformatted=$(gofmt -l cmd internal)
          if [ -n "$unformatted" ]; then
            echo "::error::files not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest && govulncheck ./...

      # 覆盖率口径:合并 profile 的语句加权 total(与 .trellis 基线同口径)。
      # 硬门禁 95%,低于即失败;threshold 与门禁提示需同步修改。
      - name: Test + coverage (>=95%, blocking)
        run: |
          go test -race -count=1 -coverprofile=cover.out ./...
          go tool cover -func=cover.out | tee coverage.txt
          total=$(awk '/^total:/ {gsub("%", "", $3); print $3}' coverage.txt)
          echo "total statement coverage: ${total}%"
          awk -v t="$total" 'BEGIN { exit !(t >= 95) }' || {
            echo "::error::total coverage ${total}% is below the 95% gate"
            exit 1
          }

  frontend:
    name: Frontend (lint + tsc + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build

  security:
    name: Semgrep (0 findings, blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.8.12"

      - name: Semgrep
        run: >
          uvx semgrep scan --config auto --error
          cmd internal web/src

  windows-smoke:
    name: Backend Windows Smoke
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Create frontend stub for embed
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path web/out | Out-Null
          New-Item -ItemType File -Force -Path web/out/.gitkeep | Out-Null

      - name: Build windows binary
        shell: pwsh
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
        run: |
          go build -o grokforge-windows-amd64.exe ./cmd/grokforge

      - name: Smoke test binary
        shell: pwsh
        run: |
          $port = 18081
          @'
          [app]
          host = "127.0.0.1"
          port = 18081
          db_driver = "sqlite"
          db_path = "data/smoke-ci.db"
          log_level = "error"
          '@ | Set-Content -Path smoke-config.toml

          $stdout = "smoke-ci.stdout.log"
          $stderr = "smoke-ci.stderr.log"
          $proc = Start-Process -FilePath .\grokforge-windows-amd64.exe -ArgumentList "-config", "smoke-config.toml" -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          try {
            $healthy = $false
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Seconds 1
              if ($proc.HasExited) {
                break
              }
              try {
                $resp = Invoke-WebRequest -Uri "http://127.0.0.1:$port/healthz"
                if ($resp.StatusCode -eq 200) {
                  $healthy = $true
                  break
                }
              } catch {
              }
            }

            if (-not $healthy) {
              if (Test-Path $stdout) {
                Write-Host "=== smoke stdout ==="
                Get-Content $stdout
              }
              if (Test-Path $stderr) {
                Write-Host "=== smoke stderr ==="
                Get-Content $stderr
              }
              throw "windows smoke test failed: /healthz did not become ready"
            }
          } finally {
            if ($null -ne $proc -and -not $proc.HasExited) {
              Stop-Process -Id $proc.Id -Force
            }
          }
